# Domain-Tuned Hyperparameters for Road Damage (RDD2022 / RDD4D) Fine-Tuning
# Designed for starting from enhanced_rdd2022_final/weights/best.pt
# Key improvements over stock COCO defaults:
#   - anchor_t: 5.0 (matches extreme aspect ratios of elongated longitudinal/transverse cracks)
#   - box: 0.075 (improves mAP@0.5:0.95 localization on hairline cracks & potholes)
#   - fl_gamma: 1.5 + cls_pw: 1.2 (handles severe class imbalance across crack/pothole types)
#   - Gentle perspective/rotation + HSV luminance shifts for wet/dry/shadowed Indian asphalt

lr0: 0.0020  # gentle initial learning rate for fine-tuning
lrf: 0.05  # final OneCycle / Cosine LR factor
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05

box: 0.075  # higher box gain for accurate crack & pothole boundaries
cls: 0.55
cls_pw: 1.20  # boost minority damage classes (potholes / alligator cracks)
obj: 1.15  # suppress false cracks on shadows, lane markings, and vehicles
obj_pw: 1.10
iou_t: 0.20
anchor_t: 5.0  # wider aspect-ratio tolerance for long thin road cracks
fl_gamma: 1.5  # focal loss for hard/small crack examples

hsv_h: 0.010
hsv_s: 0.45
hsv_v: 0.45  # simulate shadows, wet asphalt, and bright glare
degrees: 5.0
translate: 0.12
scale: 0.55
shear: 1.5
perspective: 0.0005  # simulate dashcam pitch/angle variation
flipud: 0.0
fliplr: 0.5  # horizontal flip is valid for road cracks & potholes
mosaic: 0.80
mixup: 0.15
copy_paste: 0.0
