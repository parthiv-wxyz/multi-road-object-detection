# Ultralytics YOLOv5s object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov5
# Task docs: https://docs.ultralytics.com/tasks/detect
# Example usage: python train.py --cfg yolov5s.yaml --data coco.yaml

# Parameters
nc: 5
depth_multiple: 0.33
width_multiple: 0.50
anchors:
  - [54, 19, 32, 64, 93, 29]        # P2
  - [65, 87, 187, 35, 139, 58]      # P3
  - [52, 203, 108, 152, 325, 68]    # P4
  - [170, 293, 490, 127, 263, 524]  # P5

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, LWC3, [512]],
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    [-1, 3, LWC3, [1024]],
    [-1, 1, SPPF, [1024, 5]],
  ]

# YOLOv5 v7.0 head with P2, P3, P4 and P5 outputs
head: [
    [-1, 1, ConvECA, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]], # cat backbone P4
    [-1, 3, LWC3, [512, False]],

    [-1, 1, ConvECA, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]], # cat backbone P3
    [-1, 3, C3, [256, False]],

    # -------- P2 branch --------
    [-1, 1, ConvECA, [128, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 2], 1, Concat, [1]], # cat backbone P2
    [-1, 1, C3, [128, False]], # P2
    # ---------------------------

    [-1, 1, Conv, [128, 3, 2]],
    [[-1, 18], 1, Concat, [1]], # cat head P3
    [-1, 3, C3, [256, False]],

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]], # cat head P4
    [-1, 3, LWC3, [512, False]],

    [-1, 1, DirectionalConv, [512, 3, 2]], # 5-P4/16
    [[-1, 10], 1, Concat, [1]], # cat head P5
    [-1, 3, LWC3, [1024, False]],

    [[21, 24, 27, 30], 1, Detect, [nc, anchors]],
  ]
