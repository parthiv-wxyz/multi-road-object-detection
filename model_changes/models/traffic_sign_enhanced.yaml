# Enhanced YOLOv5s for Traffic Sign Detection

nc: 5
depth_multiple: 0.33
width_multiple: 0.50

anchors:
  - [6, 11, 12, 21, 17, 31]          # P2
  - [24, 42, 47, 25, 18, 71]          # P3
  - [32, 56, 42, 75, 101, 37]         # P4
  - [51, 103, 232, 52, 465, 50]       # P5


# ============================================================
# BACKBONE
# ============================================================

backbone:
  [
    [-1, 1, Conv, [64, 6, 2, 2]],

    [-1, 1, Conv, [128, 3, 2]],

    [-1, 3, C3, [128]],

    [-1, 1, Conv, [256, 3, 2]],

    [-1, 6, C3, [256]],

    [-1, 1, Conv, [512, 3, 2]],

    [-1, 9, LWC3, [512]],

    [-1, 1, Conv, [1024, 3, 2]],

    [-1, 3, LWC3, [1024]],

    [-1, 1, SPPF, [1024, 5]],
  ]


# ============================================================
# HEAD
# ============================================================

head:
  [

    # P5 → P4
    [-1, 1, ConvECA, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, AFP, []],
    [-1, 3, LWC3, [512, False]],

    # P4 → P3
    [-1, 1, ConvECA, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, AFP, []],
    [-1, 3, C3, [256, False]],

    # P3 → P2
    [-1, 1, ConvECA, [128, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 2], 1, AFP, []],
    [-1, 1, C3, [128, False]],

    # P2 → P3
    [-1, 1, Conv, [128, 3, 2]],
    [[-1, 18], 1, AFP, []],
    [-1, 3, C3, [256, False]],

    # P3 → P4
    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, AFP, []],
    [-1, 3, LWC3, [512, False]],

    # P4 → P5
    [-1, 1, DirectionalConv, [512, 3, 2]],
    [[-1, 10], 1, AFP, []],
    [-1, 3, LWC3, [1024, False]],

    # P2 / P3 / P4 / P5 detection
    [[21, 24, 27, 30], 1, Detect, [nc, anchors]],
  ]