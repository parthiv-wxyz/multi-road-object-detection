services:
  - type: web
    name: roadsight-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements_render.txt"
    startCommand: "uvicorn backend.app_render:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: PYTHONUNBUFFERED
        value: "1"
