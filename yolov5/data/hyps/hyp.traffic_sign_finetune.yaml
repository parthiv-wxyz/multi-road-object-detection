# Domain-Tuned Hyperparameters for Indian Traffic Sign Fine-Tuning
# Designed for starting from traffic_sign_enhanced_1280_pretrained/weights/best.pt
# Key improvements over stock COCO defaults:
#   - fliplr: 0.0 (prevents mirroring directional arrows, STOP text, and speed digits)
#   - Tighter HSV bounds (preserves red/blue/yellow sign category color cues)
#   - Lower lr0 (0.0015) with cosine decay for stable fine-tuning without forgetting
#   - Higher obj gain (1.25) to penalize false positives on vehicles / hard negatives

lr0: 0.0015  # gentle initial learning rate for fine-tuning
lrf: 0.05  # final OneCycle / Cosine LR factor
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05

box: 0.06  # sharper localization on small signs
cls: 0.60  # stronger classification weight (helps Informatory & Warning AP)
cls_pw: 1.0
obj: 1.25  # stronger objectness penalty to crush vehicle false positives
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.5  # mild focal loss for rare sign categories

hsv_h: 0.008  # preserve red/blue/yellow sign colors
hsv_s: 0.35
hsv_v: 0.35
degrees: 4.0  # slight dashcam tilt variance
translate: 0.10
scale: 0.45
shear: 1.0
perspective: 0.0003
flipud: 0.0
fliplr: 0.0  # CRITICAL: never horizontally flip traffic signs!
mosaic: 0.75
mixup: 0.10
copy_paste: 0.0
